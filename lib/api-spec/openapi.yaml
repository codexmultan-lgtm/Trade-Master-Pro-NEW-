      properties:
        user:
          $ref: "#/components/schemas/User"
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    AdminUserUpdate:
      type: object
